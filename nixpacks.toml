[phases.setup]
nixPkgs = ["nodejs"]

[phases.install]
cmds = [
  "npm install --prefix backend",
  "npm install --prefix frontend"
]

[phases.build]
cmds = [
  "npm run build --prefix frontend"
]

[phases.build.env]
VITE_API_URL = "https://catalogo-cousinshopve-production.up.railway.app"

[start]
cmd = "cd backend && node server.js"

[build]
copyFiles = [
  { from = "backend", to = "/app/backend" },
  { from = "frontend/dist", to = "/app/frontend/dist" }
]