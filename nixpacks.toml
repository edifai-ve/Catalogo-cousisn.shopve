[phases.setup]
nixPkgs = ["nodejs", "caddy"]

[phases.install]
cmds = [
  "npm install --prefix backend",
  "npm install --prefix frontend"
]

[phases.build]
cmds = [
  "npm run build --prefix frontend"
]

[start]
cmd = "sh -c 'cd backend && node server.js & caddy run --config /app/Caddyfile'"

[build]
copyFiles = [
  { from = "backend", to = "/app/backend" },
  { from = "frontend/dist", to = "/app/frontend/dist" }
]